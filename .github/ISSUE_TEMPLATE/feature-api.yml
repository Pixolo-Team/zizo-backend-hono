name: 🚀 API Feature
description: Create a new API endpoint following project architecture
title: "feat: <module> - <short description>"
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ IMPORTANT

        You MUST read and follow `copilot-instructions.md` before implementing.

        All rules regarding:
        - Architecture
        - Import order
        - Utility extraction
        - Constants extraction
        - QueryResponseData pattern
        - sendResponse usage
        - JSDoc
        - Explicit return types

        are mandatory.

  - type: input
    id: module_name
    attributes:
      label: Module Name
      description: Folder name inside src/modules
      placeholder: coaches
    validations:
      required: true

  - type: dropdown
    id: http_method
    attributes:
      label: HTTP Method
      options:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
    validations:
      required: true

  - type: input
    id: route_path
    attributes:
      label: Route Path
      description: Example /coaches
      placeholder: /coaches
    validations:
      required: true

  - type: textarea
    id: request_body
    attributes:
      label: Request Body Fields (if applicable)
      description: Define expected body structure
      placeholder: |
        {
          "name": "string",
          "email": "string"
        }

  - type: textarea
    id: db_table
    attributes:
      label: Supabase Table
      description: Table name and required columns
      placeholder: |
        Table: coaches
        Columns:
        - id (uuid, PK)
        - name (text)
        - email (text)
    validations:
      required: true

  - type: textarea
    id: expected_output
    attributes:
      label: Expected API Output
      description: Define response structure and success message
      placeholder: |
        Success Response:
        {
          "data": {
            "id": "uuid",
            "name": "John Doe",
            "email": "john@example.com"
          },
          "status": "success",
          "status_code": 201,
          "message": "Coach created successfully",
          "error": null
        }

        Error Response:
        {
          "data": null,
          "status": "error",
          "status_code": 400,
          "message": "Invalid email",
          "error": "Invalid email format"
        }
    validations:
      required: true
